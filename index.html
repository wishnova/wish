<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Vanshika 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --primary: #ff6b9d;
            --secondary: #c44569;
            --accent: #ffd89b;
            --dark: #2d1b2e;
            --light: #fff5f7;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe4ec 50%, #fff0f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background with gradient orbs */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 40%, rgba(255, 107, 157, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 70%, rgba(196, 69, 105, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 10%, rgba(255, 216, 155, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 100px;
        }

        .header-emoji {
            font-size: 5rem;
            display: inline-block;
            animation: bounceHeart 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
            margin-bottom: 30px;
        }

        @keyframes bounceHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 5.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            margin-bottom: 15px;
            animation: fadeInDown 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #c44569;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease-out 0.2s both;
            margin-bottom: 20px;
        }

        .divider {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #ff6b9d, #c44569);
            margin: 20px auto;
            border-radius: 2px;
            animation: expandWidth 1.2s ease-out 0.3s both;
        }

        @keyframes expandWidth {
            from { width: 0; }
            to { width: 100px; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Wishes Grid */
        .wishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            animation: fadeIn 1.5s ease-out 0.4s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .wish-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(255, 107, 157, 0.15);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255, 107, 157, 0.1);
            animation: slideInUp 0.8s ease-out backwards;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 380px;
        }

        /* Gradient top border */
        .wish-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ff6b9d, #ffd89b, #c44569);
        }

        /* Decorative orb */
        .wish-card::after {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 216, 155, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .wish-card:nth-child(1) { animation-delay: 0.15s; }
        .wish-card:nth-child(2) { animation-delay: 0.25s; }
        .wish-card:nth-child(3) { animation-delay: 0.35s; }
        .wish-card:nth-child(4) { animation-delay: 0.45s; }
        .wish-card:nth-child(5) { animation-delay: 0.55s; }
        .wish-card:nth-child(6) { animation-delay: 0.65s; }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wish-card:hover {
            transform: translateY(-20px);
            box-shadow: 0 50px 100px rgba(255, 107, 157, 0.25);
        }

        .wish-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            animation: floatIcon 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .wish-person {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        .wish-text {
            color: #4a4a4a;
            font-size: 1.05rem;
            line-height: 2;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
            flex-grow: 1;
            font-weight: 400;
        }

        .wish-text::before {
            content: '"';
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.6;
            position: absolute;
            top: -20px;
            left: -10px;
            line-height: 0.8;
        }

        .wish-time {
            font-size: 0.85rem;
            color: #ff6b9d;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            font-weight: 600;
        }

        .accent-divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, #ff6b9d, #c44569);
            margin-top: 25px;
            margin-bottom: 15px;
            display: inline-block;
            border-radius: 1px;
        }

        /* Floating decorative elements */
        .floating-element {
            position: fixed;
            font-size: 2rem;
            opacity: 0.08;
            pointer-events: none;
            animation: drift 10s ease-in-out infinite;
            z-index: 0;
        }

        .float-1 { top: 5%; left: 3%; animation-delay: 0s; }
        .float-2 { top: 65%; left: 8%; animation-delay: 2s; }
        .float-3 { top: 25%; right: 3%; animation-delay: 4s; }
        .float-4 { bottom: 8%; right: 12%; animation-delay: 1s; }

        @keyframes drift {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(40px) rotate(15deg); }
        }

        /* Particle effect on scroll */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 3.2rem;
                letter-spacing: -1px;
                margin-bottom: 15px;
                line-height: 1.2;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .header {
                margin-bottom: 70px;
            }

            .header-emoji {
                font-size: 3.5rem;
                margin-bottom: 20px;
            }

            .wish-card {
                padding: 35px 25px;
                min-height: auto;
            }

            .wishes-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .floating-element {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Floating decorative elements -->
    <div class="floating-element float-1">💕</div>
    <div class="floating-element float-2">✨</div>
    <div class="floating-element float-3">🌹</div>
    <div class="floating-element float-4">💖</div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-emoji">💕</div>
            <h1 class="title">Happy Birthday<br>Vanshika</h1>
            <p class="subtitle">✨ To My Everything ✨</p>
            <div class="divider"></div>
        </div>

        <!-- Wishes Grid -->
        <div class="wishes-grid" id="wishList">
            <!-- Wishes will be populated here -->
        </div>
    </div>

    <script>
        // Romantic wishes for girlfriend
        const wishesData = [
            {
                icon: "💕",
                person: "Your Love",
                text: "On your special day, I want to remind you how incredibly beautiful you are—inside and out. Every moment with you feels like a blessing. Happy birthday to the love of my life.",
                time: "Forever"
            },
            {
                icon: "✨",
                person: "Your Biggest Fan",
                text: "You light up my world in ways you'll never fully understand. Your smile, your laugh, your kindness—everything about you makes me fall for you more each day. Have the most magical birthday ever.",
                time: "Always"
            },
            {
                icon: "🌹",
                person: "Your Admirer",
                text: "You're not just beautiful—you're extraordinary. The way you see the world, the dreams you chase, the kindness you show—you inspire me to be better every single day. Happy birthday to my inspiration.",
                time: "Today & Always"
            },
            {
                icon: "💖",
                person: "Your Heart",
                text: "Thank you for being exactly who you are. Thank you for the late-night talks, the unexpected hugs, and for loving me the way you do. I'm so grateful to celebrate this day with you.",
                time: "Every Day"
            },
            {
                icon: "🎀",
                person: "Your Forever",
                text: "Life with you is a adventure I don't want to end. You make ordinary moments feel magical, and I promise to spend the rest of my life making you feel as special as you are to me.",
                time: "Till Forever"
            },
            {
                icon: "💫",
                person: "Your Dream",
                text: "You deserve every beautiful thing in this world—success, happiness, love, and dreams that come true. I'm here to support every step of your journey. Happy birthday to my queen.",
                time: "Eternity"
            }
        ];

        const wishList = document.getElementById('wishList');

        function displayWishes() {
            wishList.innerHTML = '';
            wishesData.forEach((wish) => {
                const card = document.createElement('div');
                card.className = 'wish-card';
                card.innerHTML = `
                    <div class="wish-icon">${wish.icon}</div>
                    <div class="wish-person">${wish.person}</div>
                    <div class="wish-text">${wish.text}</div>
                    <div class="accent-divider"></div>
                    <div class="wish-time">💝 ${wish.time}</div>
                `;
                wishList.appendChild(card);
            });
        }

        // Smooth scroll with particle effect
        document.addEventListener('mousemove', (e) => {
            const particles = document.querySelectorAll('.particle');
            particles.forEach(p => {
                const x = (Math.random() - 0.5) * 20;
                const y = (Math.random() - 0.5) * 20;
                p.style.transform = `translate(${x}px, ${y}px)`;
            });
        });

        // Initialize
        displayWishes();
    </script>
</body>
</html>
